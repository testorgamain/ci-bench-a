name: Burst N
on:
  workflow_dispatch:
    inputs:
      label:
        description: runs-on label
        required: true
      n:
        description: number of parallel jobs
        required: true
        default: "10"
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      idx: ${{ steps.m.outputs.idx }}
    steps:
      - id: m
        run: echo "idx=$(python3 -c 'import json,sys; print(json.dumps(list(range(1,int(sys.argv[1])+1))))' '${{ inputs.n }}')" >> "$GITHUB_OUTPUT"
  hold:
    needs: plan
    runs-on: ${{ inputs.label }}
    strategy:
      fail-fast: false
      matrix:
        i: ${{ fromJSON(needs.plan.outputs.idx) }}
    steps:
      - run: sleep 20
